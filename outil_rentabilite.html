<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calculateur de rentabilité — Empire Immo</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px 16px 64px; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 1.4em; margin-bottom: 4px; }
  .sub { color: #9aa0a6; margin-bottom: 24px; font-size: 0.9em; }
  label { display: block; margin-top: 14px; font-size: 0.9em; color: #c8ccd2; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 1em; border-radius: 8px; border: 1px solid #333; background: #1a1d24; color: #e6e6e6; margin-top: 4px; }
  .resultat { margin-top: 28px; padding: 18px; border-radius: 10px; background: #1a1d24; border: 1px solid #2a2d34; }
  .pct { font-size: 2em; font-weight: 700; color: #8ab4f8; }
  .detail { color: #9aa0a6; font-size: 0.85em; margin-top: 8px; line-height: 1.5; }
  .note { color: #6b7078; font-size: 0.8em; margin-top: 24px; }
</style>
</head>
<body>
  <h1>🧮 Calculateur de rentabilité</h1>
  <div class="sub">Formule : (Loyer − Charges − Impôts − Assurance) × 12 ÷ Valeur × 100<br>Entrez les montants mensuels, choisis ton contrat d'assurance.</div>

  <label>Loyer mensuel (Ø)</label>
  <input id="loyer" type="number" placeholder="ex: 21994">

  <label>Charges mensuelles (Ø)</label>
  <input id="charges" type="number" placeholder="ex: 1910">

  <label>Impôts mensuels (Ø)</label>
  <input id="impots" type="number" placeholder="ex: 894">

  <label>Valeur du bien (Ø)</label>
  <input id="valeur" type="number" placeholder="ex: 578103">

  <label>Contrat d'assurance</label>
  <select id="assurance-contrat">
    <option value="0.05">Protection civile et tiers — 0,05%/mois (0% remb.)</option>
    <option value="0.12">Classique — 0,12%/mois (45% remb.)</option>
    <option value="0.18">Sérénité — 0,18%/mois (70% remb.)</option>
    <option value="0.26">Confort Plus — 0,26%/mois (110% remb.)</option>
    <option value="0.31" selected>Prestige ⭐ — 0,31%/mois (130% remb.)</option>
    <option value="0.30">Rapide Plus — 0,30%/mois (70% remb., délai -50%)</option>
    <option value="0.30">Premium 💎 — 0,30%/mois (100% remb., délai -70%, saphir requis)</option>
  </select>

  <div class="resultat">
    <div class="pct" id="resultat-pct">—</div>
    <div class="detail" id="resultat-detail"></div>
  </div>

  <div class="note">Outil interne — vérifie tes propres calculs avant de t'y fier pour une décision d'achat.</div>

<script>
function calculer() {
  const loyer = parseFloat(document.getElementById("loyer").value) || 0;
  const charges = parseFloat(document.getElementById("charges").value) || 0;
  const impots = parseFloat(document.getElementById("impots").value) || 0;
  const valeur = parseFloat(document.getElementById("valeur").value) || 0;

  const tauxMensuel = parseFloat(document.getElementById("assurance-contrat").value) || 0;
  const assurance = valeur * (tauxMensuel / 100); // taux du contrat = déjà un taux mensuel (1 mois de jeu = 1 jour réel)

  if (valeur <= 0) {
    document.getElementById("resultat-pct").textContent = "—";
    document.getElementById("resultat-detail").textContent = "Entre une valeur de bien supérieure à 0.";
    return;
  }

  const net = loyer - charges - impots - assurance;
  const rentabilite = (net * 12 / valeur) * 100;

  document.getElementById("resultat-pct").textContent = rentabilite.toFixed(2) + " %";
  document.getElementById("resultat-detail").innerHTML =
    "Assurance (contrat choisi) : " + assurance.toLocaleString("fr-FR", {maximumFractionDigits: 2}) + " Ø/mois<br>" +
    "Net mensuel : " + net.toLocaleString("fr-FR", {maximumFractionDigits: 2}) + " Ø<br>" +
    "Net annuel : " + (net * 12).toLocaleString("fr-FR", {maximumFractionDigits: 2}) + " Ø";
}

["loyer", "charges", "impots", "valeur"].forEach(id => {
  document.getElementById(id).addEventListener("input", calculer);
});
document.getElementById("assurance-contrat").addEventListener("change", calculer);
</script>
</body>
</html>
