let activeTab="all";let searchQuery="";

function badge(cat){const map={immo:"Immobilier",finance:"Finances",ville:"Ville",entreprise:"Entreprises",social:"Communauté",jeu:"Jeu",tech:"Technique"};return`<span class="badge ${cat}">${map[cat]||cat}</span>`}
function hl(text,q){if(!q)return text;const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');return text.replace(re,'<span class="highlight">$1</span>')}

function render(){
const q=searchQuery.toLowerCase().trim();
const sections=DATA.filter(s=>{
if(activeTab!=="all"&&s.cat!==activeTab)return false;
if(!q)return true;
if(s.title.toLowerCase().includes(q)||s.summary.toLowerCase().includes(q))return true;
return s.content.some(b=>b.title.toLowerCase().includes(q)||b.items.some(i=>i.toLowerCase().includes(q)));
});
document.getElementById("resultsCount").textContent=sections.length===DATA.length?`${DATA.length} sections disponibles`:`${sections.length} section${sections.length>1?"s":""} trouvée${sections.length>1?"s":""}`;
const cont=document.getElementById("sections");
if(sections.length===0){cont.innerHTML=`<div class="no-results"><i class="ti ti-search-off"></i>Aucun résultat pour "${searchQuery}"<br><small>Essaie d'autres mots-clés</small></div>`;return;}
cont.innerHTML=sections.map(s=>{
const matchesBody=q&&s.content.some(b=>b.title.toLowerCase().includes(q)||b.items.some(i=>i.toLowerCase().includes(q)));
const open=q&&matchesBody;
return`<div class="section-card">
<div class="section-header" onclick="toggle(${s.id})">
<i class="ti ${s.icon} section-icon"></i>
<span class="section-title">${hl(s.title,q)}${badge(s.cat)}</span>
<i class="ti ti-chevron-down chevron${open?" open":""}" id="ch-${s.id}"></i>
</div>
<div class="section-body${open?" open":""}" id="body-${s.id}">
<p class="section-summary">${hl(s.summary,q)}</p>
${s.content.map(b=>`<div class="rule-block"><div class="rule-title">${hl(b.title,q)}</div><ul>${b.items.map(i=>`<li>${hl(i,q)}</li>`).join("")}</ul></div>`).join("")}
</div>
</div>`}).join("");
}

function toggle(id){
const body=document.getElementById("body-"+id);
const ch=document.getElementById("ch-"+id);
ch.classList.toggle("open",body.classList.toggle("open"));
}

document.getElementById("searchInput").addEventListener("input",e=>{searchQuery=e.target.value;render();});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
activeTab=t.dataset.cat;
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
t.classList.add("active");render();
}));
render();
</script>
