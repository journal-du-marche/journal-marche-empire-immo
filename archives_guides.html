function lien(id) {
  return "https://monde8.empireimmo.com/press/article.php?id=" + id;
}

const conteneur = document.getElementById("categories");

function construire() {
  conteneur.innerHTML = "";
  Object.keys(DONNEES).forEach(cat => {
    const section = document.createElement("section");
    section.className = "categorie";
    section.dataset.cat = cat;
    const h2 = document.createElement("h2");
    h2.textContent = cat;
    const ul = document.createElement("ul");
    DONNEES[cat].forEach(item => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "edition-link";
      a.href = lien(item.id);
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = '<span class="num">' + item.titre + '</span><span class="date">' + item.date + '</span>';
      li.appendChild(a);
      ul.appendChild(li);
    });
    section.appendChild(h2);
    section.appendChild(ul);
    conteneur.appendChild(section);
  });
}

function filtrer(filtre) {
  const f = filtre.trim().toLowerCase();
  document.querySelectorAll("section.categorie").forEach(section => {
    let compte = 0;
    section.querySelectorAll("li").forEach(li => {
      const visible = li.textContent.toLowerCase().includes(f);
      li.style.display = visible ? "" : "none";
      if (visible) compte++;
    });
    section.classList.toggle("a-du-contenu", compte > 0);
  });
}

construire();
filtrer("");
document.getElementById("recherche").addEventListener("input", (e) => filtrer(e.target.value));
